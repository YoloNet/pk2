# PokerKu — Aplikasi Android Native (Kotlin + Jetpack Compose)
# Texas Hold'em offline lawan bot AI. v1.0.0 (versionCode 1).
# applicationId com.pokerku.app. Offline sepenuhnya — tiada rangkaian,
# tiada login, tiada iklan, tiada analytics.
#
# PELAJARAN DARI kuv2 (jangan ulang):
# - KSP 2.4.0 TIDAK WUJUD — dan projek ini langsung TIDAK perlukan KSP
#   (tiada Room), jadi plugin KSP tidak disenaraikan langsung.
# - JANGAN apply plugin kotlin-android (konflik AGP 9).
# - JANGAN masukkan play-services-ads (crash semasa launch bila tiada App ID).

[versions]
agp = "9.5.0"
kotlin = "2.4.10"
gradle = "9.8.2"
compileSdk = "36"
targetSdk = "36"
minSdk = "24"

# Jetpack Compose (BOM mengurus versi serasi antara library Compose)
composeBom = "2025.05.00"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
materialIconsExtended = "1.7.8"

# Data tempatan sahaja (DataStore) + kerja latar ringan
datastore = "1.1.1"
kotlinxCoroutines = "1.10.1"

# Java 8+ API desugaring (java.time pada minSdk 24)
desugarJdkLibs = "2.1.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.13.1" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
